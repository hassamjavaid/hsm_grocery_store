<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> hassm Online Grocery | Hassam Javaid</title>
    <style>
        :root { --primary: #27ae60; --dark: #2c3e50; --light: #ecf0f1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f9f9f9; margin: 0; }
        .navbar { background: var(--dark); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=800&q=80'); 
                height: 200px; background-size: cover; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .container { padding: 2rem 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee; }
        .card:hover { transform: translateY(-5px); }
        .card-img { font-size: 4rem; background: var(--light); padding: 20px; text-align: center; }
        .card-body { padding: 1.5rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; width: 85%; text-align: center; font-weight: bold; }
        .badge { background: #e67e22; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Hassam GROCERY</h2>
        <div>
            <a href="/cart" style="color:white; text-decoration:none; margin-right: 20px;">🛒 My Cart</a>
            <a href="/track" style="color:white; text-decoration:none;">📍 Track Order</a>
        </div>
    </div>

    <div class="hero">
        <h1>Defining Possibilities, Creating Opportunities</h1>
        <p>Partnering with local suppliers for fresh and quality products [cite: 30]</p>
    </div>

    <div class="container">
        <div class="grid">
            {% for p in products %}
            <div class="card">
                <div class="card-img">{{ p.img }}</div>
                <div class="card-body">
                    <span class="badge">{{ p.category }}</span>
                    <h3>{{ p.name }}</h3>
                    <p style="color: var(--primary); font-size: 1.2rem; font-weight: bold;">Rs. {{ p.price }}</p>
                    <a href="{{ url_for('add_to_cart', product_id=p.id) }}" class="btn">Add to Cart</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
